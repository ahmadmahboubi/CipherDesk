name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 2.0.0'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"
        shell: pwsh

      - name: Test before publishing
        run: dotnet test -c Release

      # ReadyToRun is disabled for the cross-compiled ARM64 build: it needs a matching
      # host and silently produces a slower binary rather than failing.
      - name: Publish
        run: >
          dotnet publish src/CipherDesk.App
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=${{ matrix.rid == 'win-x64' }}
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/${{ matrix.rid }}

      - name: Stage the archive contents
        run: |
          $stage = "artifacts/stage/${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item artifacts/${{ matrix.rid }}/CipherDesk.exe $stage
          Copy-Item README.md, LICENSE, CHANGELOG.md $stage
          Copy-Item docs/FILE-FORMAT.md, docs/MIGRATION.md $stage
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "artifacts/CipherDesk-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
        shell: pwsh

      - name: Checksum
        run: |
          $zip = "artifacts/CipherDesk-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) `
            | Out-File "$zip.sha256" -Encoding ascii
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: CipherDesk-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            Downloads are portable: extract and run `CipherDesk.exe`. No installer, no runtime to install.

            Verify your download against the accompanying `.sha256` file before running it.
          files: |
            downloads/*.zip
            downloads/*.sha256
